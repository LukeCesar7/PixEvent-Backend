# Perfil de testes: H2 em memória no modo PostgreSQL (não precisa de Docker nem de banco instalado).
spring:
  datasource:
    url: jdbc:h2:mem:pixevent_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

app:
  base-url: http://localhost:3001
  cors-origins: ""
  backup:
    on-start: false
  admin:
    password: senha-teste
    secret: segredo-legado
    allow-legacy-secret: false
  jwt:
    secret: jwt-secret-de-teste
    expires-in: 1h
  rate-limit:
    api: 100000
    login: 100000
    pedido: 100000
    scanner: 100000
